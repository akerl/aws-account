---
name: Build
'on':
  push:
    branches:
    - main
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TERRAFORM_VERSION: 1.15.8
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Download Terraform
      run: "./scripts/download_terraform.sh $TERRAFORM_VERSION"
    - name: Init workspace
      run: "~/tfbin/terraform init -upgrade -input=false"
    - name: Check format
      run: "~/tfbin/terraform fmt -write=false -diff=true -check"
    - name: Check plan
      run: "~/tfbin/terraform plan -detailed-exitcode -input=false"
      env:
        AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
    - name: Post to hook-exporter
      uses: akerl/.github/actions/hook-exporter@main
      with:
        token: ${{ secrets.EXPORTER_TOKEN }}
        status: ${{ job.status }}
      if: always() && github.ref == 'refs/heads/main'
